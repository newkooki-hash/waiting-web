<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오란다 볼링</title>
<link rel="stylesheet" href="/theme.css">
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 system-ui,"Malgun Gothic",sans-serif; }
  main { max-width:640px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:1.3rem; margin:0 0 4px; }
  .muted { color:var(--muted); font-size:.9rem; }
  .doc { white-space:pre-wrap; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-top:16px; }
</style>
</head>
<body>
<div class="brandbar"><span>오란다 볼링파크</span></div>
<main>
  <h1 id="title"></h1>
  <div class="muted" id="meta"></div>
  <div class="doc" id="doc"></div>
</main>
<script>
const type = location.pathname === '/privacy' ? 'privacy' : 'terms';
fetch('/api/policy?type=' + type).then((r) => r.json()).then((p) => {
  document.title = `${p.title} · 오란다 볼링`;
  document.getElementById('title').textContent = p.title;
  document.getElementById('meta').textContent = p.body ? `시행 ${(p.updatedAt || '').slice(0, 10)}` : '';
  const doc = document.getElementById('doc');
  doc.textContent = p.body || '아직 등록된 내용이 없습니다.';
  if (!p.body) doc.className = 'doc muted';
});
</script>
</body>
</html>
