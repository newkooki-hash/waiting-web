<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="naver-site-verification" content="8349e9d540e282f98754044c89a42f62a2078ccf" />
<title>오란다 볼링 대기 접수</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1f24; --muted:#6b7280; --accent:#d9480f; --line:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --card:#1e2127; --text:#eceef1; --muted:#9aa1ad; --accent:#ff7a3d; --line:#2e333b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,"Malgun Gothic",sans-serif; }
  main { max-width:420px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:1.3rem; margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
  label { display:block; font-size:.9rem; color:var(--muted); margin:14px 0 4px; }
  input, select { width:100%; padding:12px; font-size:1rem; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); }
  button { width:100%; margin-top:20px; padding:14px; font-size:1rem; font-weight:600; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  button.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); margin-top:12px; }
  .sso { display:block; text-align:center; text-decoration:none; padding:14px; margin-top:10px; border-radius:8px; font-weight:600; }
  .sso.kakao { background:#fee500; color:#191919; }
  .sso.naver { background:#03c75a; color:#fff; }
  #userbar[hidden] { display:none; }
  .err { color:#d92d20; margin-top:12px; min-height:1.4em; }
  .big { font-size:3rem; font-weight:700; text-align:center; margin:8px 0; }
  .center { text-align:center; }
  .muted { color:var(--muted); }
  .called { color:var(--accent); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>오란다 볼링 대기 접수</h1>

  <section id="notice" class="card center" hidden>
    <p id="noticeText" style="margin:0"></p>
  </section>

  <section id="login" class="card" hidden>
    <p class="center muted" style="margin-top:0">간편 로그인 후 대기 접수를 할 수 있습니다.</p>
    <div id="providers"></div>
    <div id="loginErr" class="err center" role="alert"></div>
  </section>

  <div id="userbar" class="muted" hidden style="display:flex;justify-content:space-between;margin-bottom:8px">
    <span id="me"></span><a href="#" id="logout">로그아웃</a>
  </div>

  <section id="verify" class="card" hidden>
    <p class="muted" style="margin-top:0">대기 호출을 받으려면 휴대전화 인증이 필요합니다. 한 번만 인증하면 됩니다.</p>
    <label for="vphone">휴대전화번호</label>
    <input id="vphone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="01012345678">
    <button type="button" id="sendCode">인증번호 받기</button>
    <div id="codeBox" hidden>
      <label for="vcode">인증번호 6자리</label>
      <input id="vcode" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
      <button type="button" id="checkCode">확인</button>
    </div>
    <div id="verr" class="err" role="alert"></div>
  </section>

  <form id="form" class="card" hidden>
    <label for="name">이름</label>
    <input id="name" autocomplete="name" maxlength="20" required>
    <div class="muted" id="phoneShown" style="margin-top:14px"></div>
    <label for="party">인원 (최대 8명)</label>
    <select id="party"></select>
    <button type="submit">대기 접수</button>
    <div id="err" class="err" role="alert"></div>
  </form>

  <section id="status" class="card" hidden>
    <div class="center muted" id="who"></div>
    <div class="big" id="main"></div>
    <div class="center muted" id="sub"></div>
    <button id="cancel" class="ghost">대기 취소</button>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const KEY = 'waitingToken';
const store = {
  get() { try { return localStorage.getItem(KEY); } catch { return null; } },
  set(v) { try { localStorage.setItem(KEY, v); } catch {} },
  clear() { try { localStorage.removeItem(KEY); } catch {} },
};
let token = store.get();

$('party').innerHTML = Array.from({ length: 8 }, (_, i) => `<option value="${i + 1}">${i + 1}명</option>`).join('');

let me = { user: null, providers: [] };
async function loadMe() {
  me = await (await fetch('/api/me')).json();
  if (me.user && !token && me.activeToken) { token = me.activeToken; store.set(token); }
}

function showForm() {
  const logged = !!me.user;
  // 접수 중지, 또는 매장 QR을 스캔하지 않은 기기는 접수 단계를 보여주지 않는다
  const blocked = !me.intake.open
    ? '지금은 접수 중이 아닙니다.'
    : !me.intake.allowed
      ? (new URLSearchParams(location.search).get('qr') === 'invalid'
        ? '만료되었거나 올바르지 않은 QR 코드입니다. 매장의 최신 QR 코드를 다시 스캔해 주세요.'
        : '매장에 비치된 QR 코드를 스캔해 접수해 주세요.')
      : '';
  $('notice').hidden = !blocked; $('noticeText').textContent = blocked;
  if (blocked) {
    $('login').hidden = true; $('verify').hidden = true; $('form').hidden = true; $('status').hidden = true;
    $('userbar').hidden = !logged;
    if (logged) $('me').textContent = me.user.name + '님';
    return;
  }
  const verified = logged && !!me.user.phone;
  $('login').hidden = logged; $('verify').hidden = !logged || verified;
  $('form').hidden = !verified; $('status').hidden = true;
  $('userbar').hidden = !logged;
  if (logged) {
    $('me').textContent = me.user.name + '님'; if (!$('name').value) $('name').value = me.user.name;
    $('phoneShown').textContent = verified ? '인증된 번호: ' + me.user.phone : '';
  }
  else {
    $('providers').innerHTML = me.providers.map((p) => `<a class="sso ${p.id}" href="/auth/${p.id}">${p.label}로 시작하기</a>`).join('')
      || '<div class="muted center">로그인 설정이 아직 되어 있지 않습니다.</div>';
    const q = new URLSearchParams(location.search).get('login');
    $('loginErr').textContent = q === 'failed' ? '로그인에 실패했습니다. 다시 시도해 주세요.' : '';
  }
}

async function refresh() {
  if (!token) return showForm();
  $('notice').hidden = true; $('login').hidden = true; $('verify').hidden = true; $('userbar').hidden = !me.user;
  const r = await fetch('/api/entries/' + token);
  if (!r.ok) { store.clear(); token = null; return showForm(); }
  const e = await r.json();
  $('form').hidden = true; $('status').hidden = false;
  $('who').textContent = `${e.name}님 · ${e.partySize}명`;
  const main = $('main'), sub = $('sub');
  main.className = 'big';
  $('cancel').hidden = !(e.status === 'WAITING' || e.status === 'CALLED');
  if (e.status === 'WAITING') {
    main.textContent = `${e.position}번째`;
    sub.textContent = e.position === 1 ? '곧 호출됩니다. 매장 근처에서 대기해 주세요.' : `앞에 ${e.position - 1}팀이 대기 중입니다.`;
  } else if (e.status === 'CALLED') {
    main.textContent = '호출되었습니다'; main.className = 'big called';
    sub.textContent = '프런트로 와주세요.';
  } else if (e.status === 'ASSIGNED') {
    main.textContent = `${e.lanes}번 레인`;
    sub.innerHTML = '배정되었습니다. 즐거운 시간 되세요!<br><a href="#" id="again">새로 접수하기</a>';
    $('again').onclick = (ev) => { ev.preventDefault(); store.clear(); token = null; showForm(); };
  } else {
    main.textContent = e.status === 'FINISHED' ? '이용이 끝났습니다' : '대기가 취소되었습니다';
    sub.textContent = '';
    store.clear(); token = null;
    $('cancel').hidden = true;
    $('sub').innerHTML = '<a href="/">새로 접수하기</a>';
  }
}

$('form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  $('err').textContent = '';
  const r = await fetch('/api/entries', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: $('name').value, partySize: Number($('party').value) }),
  });
  const b = await r.json();
  if (r.status === 403 && b.code === 'PHONE_REQUIRED') { await loadMe(); return showForm(); }
  if (r.status === 401 || b.code === 'INTAKE_CLOSED' || b.code === 'QR_REQUIRED') { await loadMe(); return showForm(); }
  if (r.ok || r.status === 409 && b.token) { token = b.token; store.set(token); return refresh(); }
  $('err').textContent = b.error || '접수에 실패했습니다.';
});

async function postJson(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  return { ok: r.ok, status: r.status, body: await r.json().catch(() => ({})) };
}
let cooldown;
$('sendCode').onclick = async () => {
  $('verr').textContent = '';
  const btn = $('sendCode'); btn.disabled = true;
  const r = await postJson('/api/phone/send', { phone: $('vphone').value });
  if (r.status === 403) { await loadMe(); showForm(); }
  if (!r.ok) { $('verr').textContent = r.body.error || '요청에 실패했습니다.'; btn.disabled = false; return; }
  $('codeBox').hidden = false; $('vcode').focus();
  let left = 60; btn.textContent = `다시 받기 (${left})`;
  clearInterval(cooldown);
  cooldown = setInterval(() => {
    if (--left > 0) btn.textContent = `다시 받기 (${left})`;
    else { clearInterval(cooldown); btn.textContent = '다시 받기'; btn.disabled = false; }
  }, 1000);
};
$('checkCode').onclick = async () => {
  $('verr').textContent = '';
  const r = await postJson('/api/phone/verify', { code: $('vcode').value });
  if (!r.ok) { $('verr').textContent = r.body.error || '인증에 실패했습니다.'; return; }
  await loadMe(); showForm();
};

$('cancel').addEventListener('click', async () => {
  if (!confirm('대기를 취소할까요?')) return;
  await fetch(`/api/entries/${token}/cancel`, { method: 'POST' });
  refresh();
});

$('logout').onclick = async (ev) => {
  ev.preventDefault();
  await fetch('/api/logout', { method: 'POST' });
  store.clear(); token = null; me = { ...me, user: null, activeToken: null };
  history.replaceState(null, '', '/');
  showForm();
};

const es = new EventSource('/api/events');
es.onmessage = refresh;
loadMe().then(refresh);
</script>
</body>
</html>
