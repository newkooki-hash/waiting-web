<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오란다 볼링 정기 대회 신청</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1f24; --muted:#6b7280; --accent:#d9480f; --line:#e5e7eb; --ok:#2b8a3e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --card:#1e2127; --text:#eceef1; --muted:#9aa1ad; --accent:#ff7a3d; --line:#2e333b; --ok:#69db7c; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,"Malgun Gothic",sans-serif; }
  main { max-width:420px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:1.3rem; margin:0 0 16px; }
  h2 { font-size:1.1rem; margin:0 0 4px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:12px; }
  label { display:block; font-size:.9rem; color:var(--muted); margin:14px 0 4px; }
  select, input { width:100%; padding:12px; font-size:1rem; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); }
  button { width:100%; margin-top:16px; padding:14px; font-size:1rem; font-weight:600; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  button.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); }
  button:disabled { opacity:.55; cursor:default; }
  .sso { display:block; text-align:center; text-decoration:none; padding:14px; margin-top:10px; border-radius:8px; font-weight:600; }
  .sso.kakao { background:#fee500; color:#191919; }
  .sso.naver { background:#03c75a; color:#fff; }
  .err { color:#d92d20; margin-top:12px; min-height:1.4em; }
  .muted { color:var(--muted); font-size:.9rem; }
  .badge { display:inline-block; padding:2px 10px; border-radius:99px; font-weight:700; font-size:.85rem; background:var(--line); }
  .badge.ok { color:var(--ok); }
  .badge.wait { color:var(--accent); }
  .info { white-space:pre-wrap; margin-top:10px; padding:10px; border-radius:8px; background:var(--bg); font-size:.9rem; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>정기 대회 신청</h1>
  <p class="muted"><a href="/" style="color:inherit">← 대기 접수</a></p>

  <section id="login" class="card" hidden>
    <p class="muted" style="margin-top:0">간편 로그인 후 신청할 수 있습니다.</p>
    <div id="providers"></div>
  </section>

  <div id="userbar" class="muted" hidden style="display:flex;justify-content:space-between;margin-bottom:8px">
    <span id="me"></span><a href="#" id="logout">로그아웃</a>
  </div>

  <section id="verify" class="card" hidden>
    <p class="muted" style="margin-top:0">신청 확인과 안내를 위해 휴대전화 인증이 필요합니다. 한 번만 인증하면 됩니다.</p>
    <label for="vphone">휴대전화번호</label>
    <input id="vphone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="01012345678">
    <button type="button" id="sendCode">인증번호 받기</button>
    <div id="codeBox" hidden>
      <label for="vcode">인증번호 6자리</label>
      <input id="vcode" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
      <button type="button" id="checkCode">확인</button>
    </div>
    <div id="verr" class="err" role="alert"></div>
  </section>

  <section id="profile" class="card" hidden>
    <h2 id="profileTitle">정회원 가입</h2>
    <p class="muted" id="profileHint" style="margin:4px 0 0">대회 신청에는 생년월일과 성별이 필요합니다. 핸디캡 적용에 쓰이며, 매장에서 확인할 수 있습니다.</p>
    <label for="pbirth">생년월일</label>
    <input id="pbirth" type="date" min="1900-01-01" required>
    <div class="muted" id="pbirthHint" style="margin-top:4px" hidden></div>
    <label for="pgender">성별</label>
    <select id="pgender" required>
      <option value="">선택</option>
      <option value="m">남</option>
      <option value="f">여</option>
    </select>
    <button type="button" id="saveProfile">저장</button>
    <div id="perr" class="err" role="alert"></div>
    <div class="muted">허위로 입력한 경우 대회 참가가 제한될 수 있습니다. 입력한 내용이 바뀌면 이력이 기록됩니다.</div>
  </section>

  <div id="list"></div>
  <div id="err" class="err" role="alert"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const MINE = { PENDING: ['입금 대기', 'wait'], CONFIRMED: ['신청 확정', 'ok'], WAITLIST: ['대기 중', 'wait'] };
let me;

async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  return { ok: r.ok, status: r.status, body: await r.json().catch(() => ({})) };
}

let profileLoaded = false;
async function loadProfile() {
  const r = await fetch('/api/tournament-profile');
  if (!r.ok) return;
  const p = await r.json();
  me.user.fullMember = p.fullMember;
  $('profileTitle').textContent = p.fullMember ? '내 정보 (정회원)' : '정회원 가입';
  if (profileLoaded) return; // 입력 중인 값을 덮어쓰지 않는다
  profileLoaded = true;
  $('pbirth').value = p.birthDate; $('pgender').value = p.gender;
  // 이관 회원은 출생연도만 있는 경우가 있어 연도를 안내한다
  $('pbirthHint').hidden = !(p.birthYear && !p.birthDate);
  $('pbirthHint').textContent = p.birthYear ? `기존 정보: ${p.birthYear}년생. 정확한 생년월일을 입력해 주세요.` : '';
}
$('saveProfile').onclick = async () => {
  $('perr').textContent = '';
  const r = await post('/api/tournament-profile', { birthDate: $('pbirth').value, gender: $('pgender').value });
  if (!r.ok) return ($('perr').textContent = r.body.error || '저장에 실패했습니다.');
  $('perr').textContent = ''; profileLoaded = false;
  await load();
  $('profileHint').textContent = '저장되었습니다. 정회원으로 대회에 신청할 수 있습니다.';
};

async function load() {
  me = await (await fetch('/api/me')).json();
  const logged = !!me.user, verified = logged && !!me.user.phone;
  $('login').hidden = logged; $('verify').hidden = !logged || verified; $('userbar').hidden = !logged;
  if (logged) $('me').textContent = me.user.name + '님';
  else $('providers').innerHTML = me.providers.map((p) => `<a class="sso ${p.id}" href="/auth/${p.id}?next=tournament">${p.label}로 시작하기</a>`).join('')
    || '<div class="muted">로그인 설정이 아직 되어 있지 않습니다.</div>';

  $('profile').hidden = !verified;
  if (verified) await loadProfile();

  const { tournaments } = await (await fetch('/api/tournaments')).json();
  $('list').innerHTML = tournaments.length ? tournaments.map((t) => {
    const mine = MINE[t.mine];
    const full = !!me.user?.fullMember;
    const status = mine ? `<span class="badge ${mine[1]}">${mine[0]}</span>` : t.apply === 'before' ? '<span class="badge">신청 시작 전</span>' : t.apply === 'closed' ? '<span class="badge">신청 마감</span>' : '';
    // 신청하기는 관리자가 정한 신청 시작 시각부터 켜진다. 취소는 입금 전 신청에만
    const canApply = t.apply === 'open' && logged && verified && full && !mine;
    const canCancel = !!mine && t.mine !== 'CONFIRMED';
    const notice = logged && verified && !full ? '대회는 정회원만 신청할 수 있습니다. 위에서 생년월일과 성별을 입력해 정회원으로 가입해 주세요.' : '';
    return `<section class="card">
      <h2>${esc(t.name)}</h2>
      <div class="muted">대회 ${esc(t.eventAt)}</div>
      <div class="muted">신청 ${esc(t.applyStart)} ~ ${esc(t.applyEnd)}</div>
      <div class="muted">참가 ${t.taken}명 / 정원 ${t.capacity}명 · 대기 ${t.waitlist}명${t.fee ? ` · 참가비 ${t.fee.toLocaleString()}원` : ''}</div>
      ${t.info ? `<div class="info">${esc(t.info)}</div>` : ''}
      <div style="margin-top:12px">${status}</div>
      ${t.mine === 'CONFIRMED' ? '<div class="muted" style="margin-top:8px">취소는 매장에 문의해 주세요.</div>' : ''}
      ${notice ? `<div class="muted" style="margin-top:8px">${notice}</div>` : ''}
      <div style="display:flex;gap:8px">
        <button data-act="apply" data-id="${t.id}"${canApply ? '' : ' disabled'}>${t.taken >= t.capacity ? '대기 신청' : '신청하기'}</button>
        <button class="ghost" data-act="cancel" data-id="${t.id}"${canCancel ? '' : ' disabled'}>신청 취소</button>
      </div>
    </section>`;
  }).join('') : '<div class="card muted">진행 중인 대회가 없습니다.</div>';
}

$('list').addEventListener('click', async (ev) => {
  const btn = ev.target.closest('button[data-act]');
  if (!btn) return;
  $('err').textContent = '';
  if (!me.user) return ($('err').textContent = '먼저 로그인해 주세요.');
  if (btn.dataset.act === 'cancel' && !confirm('신청을 취소할까요?')) return;
  btn.disabled = true;
  const r = await post(`/api/tournaments/${btn.dataset.id}/${btn.dataset.act}`);
  if (!r.ok) $('err').textContent = r.body.error || '처리에 실패했습니다.';
  load();
});

let cooldown;
$('sendCode').onclick = async () => {
  $('verr').textContent = '';
  const btn = $('sendCode'); btn.disabled = true;
  const r = await post('/api/phone/send', { phone: $('vphone').value, for: 'tournament' });
  if (!r.ok) { $('verr').textContent = r.body.error || '요청에 실패했습니다.'; btn.disabled = false; return; }
  $('codeBox').hidden = false; $('vcode').focus();
  let left = 60; btn.textContent = `다시 받기 (${left})`;
  clearInterval(cooldown);
  cooldown = setInterval(() => {
    if (--left > 0) btn.textContent = `다시 받기 (${left})`;
    else { clearInterval(cooldown); btn.textContent = '다시 받기'; btn.disabled = false; }
  }, 1000);
};
$('checkCode').onclick = async () => {
  $('verr').textContent = '';
  const r = await post('/api/phone/verify', { code: $('vcode').value });
  if (!r.ok) { $('verr').textContent = r.body.error || '인증에 실패했습니다.'; return; }
  load();
};
$('logout').onclick = async (ev) => { ev.preventDefault(); await post('/api/logout'); profileLoaded = false; load(); };

load();
</script>
</body>
</html>
